server:
  port: 8080

spring:
  application:
    name: maestro-pezcaderia-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

supabase:
  jwt:
    secret: ${SUPABASE_JWT_SECRET:super-secret-jwt-token-key-for-supabase-auth-dev-32-chars-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
