<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Subtle grid and border -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6" />

  <!-- Ocean wave curves -->
  <path d="M 24 140 Q 60 125, 96 140 T 168 140" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M 24 154 Q 60 142, 96 154 T 168 154" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Main stylized Fish Symbol -->
  <g filter="url(#glow)">
    <!-- Fish Body Curve -->
    <path d="M 44 88 C 65 52, 120 54, 142 88 C 120 122, 65 124, 44 88 Z" fill="url(#fishGrad)" />
    
    <!-- Tail Fin -->
    <path d="M 136 88 L 162 66 C 158 80, 158 96, 162 110 Z" fill="url(#fishGrad)" />
    
    <!-- Eye -->
    <circle cx="72" cy="84" r="6" fill="#0f172a" />
    <circle cx="74" cy="82" r="2.2" fill="#ffffff" />
    
    <!-- Gill line -->
    <path d="M 88 74 C 94 82, 94 94, 88 102" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Scales line -->
    <path d="M 106 78 C 111 84, 111 92, 106 98" fill="none" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- PWA Accent Dot -->
  <circle cx="156" cy="36" r="6" fill="#10b981" />
</svg>
