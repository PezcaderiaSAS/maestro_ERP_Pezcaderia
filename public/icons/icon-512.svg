<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fishGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Subtle grid and border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Ocean wave curves -->
  <path d="M 64 370 Q 160 330, 256 370 T 448 370" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-opacity="0.35" />
  <path d="M 64 410 Q 160 380, 256 410 T 448 410" fill="none" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-opacity="0.25" />

  <!-- Main stylized Fish Symbol -->
  <g filter="url(#glow512)">
    <!-- Fish Body Curve -->
    <path d="M 116 235 C 174 138, 320 144, 380 235 C 320 326, 174 332, 116 235 Z" fill="url(#fishGrad512)" />
    
    <!-- Tail Fin -->
    <path d="M 364 235 L 432 176 C 422 214, 422 256, 432 294 Z" fill="url(#fishGrad512)" />
    
    <!-- Eye -->
    <circle cx="192" cy="224" r="16" fill="#0f172a" />
    <circle cx="197" cy="219" r="6" fill="#ffffff" />
    
    <!-- Gill line -->
    <path d="M 235 197 C 251 219, 251 251, 235 273" fill="none" stroke="#064e3b" stroke-width="9" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Scales line -->
    <path d="M 283 208 C 296 224, 296 246, 283 262" fill="none" stroke="#064e3b" stroke-width="7" stroke-linecap="round" stroke-opacity="0.4" />
  </g>

  <!-- PWA Accent Dot -->
  <circle cx="416" cy="96" r="16" fill="#10b981" />
</svg>
